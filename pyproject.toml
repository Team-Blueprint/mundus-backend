[project]
name = "mundus-backend"
version = "0.1.0"
description = "FastAPI backend for Mundus waste evacuation verification platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
    "cloudinary>=1.46.2",
    "python-dotenv>=1.2.3",
    "pyjwt>=2.14.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=5.0.0",
    "python-multipart>=0.0.32",
    "alembic>=1.20.0",
    "psycopg2-binary>=2.9.13",
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
